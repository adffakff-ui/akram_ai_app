<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق Akram AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 1rem; 
      text-align: center; 
    }
    .card { 
      background: #1e293b; 
      padding: 2.5rem 2rem; 
      border-radius: 16px; 
      max-width: 450px; 
      width: 100%; 
      border: 1px solid #334155; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
    }
    .badge { 
      display: inline-block; 
      background: #0369a1; 
      color: #e0f2fe; 
      padding: 0.3rem 0.8rem; 
      border-radius: 9999px; 
      font-size: 0.85rem; 
      margin-bottom: 1.25rem; 
      font-weight: 600;
    }
    h1 { color: #38bdf8; font-size: 1.6rem; margin-bottom: 1rem; }
    p { color: #94a3b8; line-height: 1.6; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Akram AI</span>
    <h1>تم تشغيل التطبيق بنجاح!</h1>
    <p>تم ربط ملف index.html وتحديث النشر على Vercel بنجاح.</p>
  </div>
</body>
  </html
